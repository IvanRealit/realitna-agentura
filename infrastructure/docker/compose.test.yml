# Ephemeral local test database only. Never attach a production volume.
services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: realitna
      POSTGRES_PASSWORD: test-only-db
      POSTGRES_DB: realitna_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realitna -d realitna_test"]
      interval: 2s
      timeout: 3s
      retries: 20
